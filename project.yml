name: WokyisScreensaver
options:
  bundleIdPrefix: ai.unreallabs
  deploymentTarget:
    macOS: "14.0"
  developmentLanguage: en
settings:
  base:
    SWIFT_VERSION: "6.0"
    MACOSX_DEPLOYMENT_TARGET: "14.0"
configs:
  Debug: debug
  Release: release
targets:
  WokyisScreensaver:
    type: application
    platform: macOS
    sources:
      - path: WokyisScreensaver
    info:
      path: WokyisScreensaver/Info.plist
      properties:
        CFBundleName: WokyisScreensaver
        CFBundleDisplayName: Wokyis Screensaver
        LSApplicationCategoryType: public.app-category.graphics-design
        NSHumanReadableCopyright: ""
        NSPrincipalClass: NSApplication
        NSMainStoryboardFile: ""
        NSHighResolutionCapable: true
        CFBundleIconName: AppIcon
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: ai.unreallabs.wokyis-screensaver
        ENABLE_HARDENED_RUNTIME: YES
        ENABLE_APP_SANDBOX: NO
        GENERATE_INFOPLIST_FILE: NO
        MTL_FAST_MATH: YES
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
      configs:
        Debug:
          CODE_SIGN_STYLE: Automatic
          CODE_SIGN_IDENTITY: "-"
        Release:
          CODE_SIGN_STYLE: Manual
          CODE_SIGN_IDENTITY: "Developer ID Application"
          DEVELOPMENT_TEAM: "453ZXYW34S"
          OTHER_CODE_SIGN_FLAGS: "--timestamp --options=runtime"
          CODE_SIGN_INJECT_BASE_ENTITLEMENTS: NO
